mp.messaging.incoming.words-in.auto.offset.reset=earliest
mp.messaging.incoming.words-in.topic=words
mp.messaging.outgoing.words-out.topic=words

# --- Base de datos ---
# Sin URL fija: en dev/test, Quarkus Dev Services levanta un Postgres en
# Docker automáticamente (requiere Docker instalado y corriendo). Para
# producción, definir por variables de entorno:
#   QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD, QUARKUS_DATASOURCE_JDBC_URL
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
