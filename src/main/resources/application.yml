quarkus:
  application:
    name: ParkFinder
    version: 1.0-SNAPSHOT

  # HTTP
  http:
    port: 8860
    host: localhost
    root-path: /kick # Todo tus endpoints tendrán el prefijo /kick (ej: http://localhost:8860/kick/api)
    cors:
      ~: true
      origins: "*"
      methods: "GET,POST,PUT,DELETE,OPTIONS"
      headers: "Content-Type,Authorization,X-Requested-With"

  # Base de datos
  datasource:
    db-kind: postgresql
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    jdbc:
      url: ${DB_URL}

  # Hibernate ORM
  hibernate-orm:
    database:
      generation: update # Usa 'update' para no borrar los datos cada vez que compiles
    log:
      sql: true

  # Configuracion de Logs
  log:
    level: INFO
    console:
      enabled: true
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"

    file:
      enabled: true
      path: logs/parkfinder.log
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
      rotation:
        max-file-size: 5M
        max-backup-index: 5
        file-suffix: yyyy-MM-dd

  swagger-ui:
    always-include: true

# MicroProfile OpenAPI (DEBE IR EN LA RAÍZ, FUERA DE QUARKUS)
mp:
  openapi:
    extensions:
      smallrye:
        info:
          title: "Backend Parkfinder"
          version: "1.1.0"
          description: "API generado en Quarkus para Parkfinder"
          contact-name: "javiergiovanny89@gmail.com"